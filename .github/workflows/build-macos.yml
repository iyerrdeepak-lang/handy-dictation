name: Build macOS app

# Builds Handy with dictation commands for Apple Silicon Macs and publishes the
# app as a GitHub release, so it can be downloaded without building locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos
  cancel-in-progress: true

jobs:
  build:
    # Apple Silicon runners are often capacity-constrained and a job can be
    # cancelled unassigned, so the same arm64 app is requested from two
    # arm64 runner pools at once. Both are native Apple Silicon builds (an
    # Intel build runs CPU-only under Rosetta, far too slow). On macos-15,
    # build.rs automatically falls back to the Apple Intelligence stub.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            asset: Handy-dictation-macos-arm64.zip
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: Handy-dictation-macos-arm64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.runner }}
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      - name: Build Handy.app
        env:
          # Bakes "never self-update" into this build so the official
          # updater can't replace it with a version without dictation commands.
          HANDY_DISABLE_UPDATER: "1"
        run: >
          bun run tauri build
          --target ${{ matrix.target }}
          --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Package app
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Handy.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          # ditto keeps the bundle's symlinks and code signature intact.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Handy 0.9.8 + dictation commands (build ${{ github.run_number }})" \
              --notes "macOS build of Handy 0.9.8 with spoken dictation commands (period, comma, colon, new line, new paragraph, ...). Unsigned: on first launch, allow it in System Settings > Privacy & Security." \
              --latest || true
          fi
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber
